name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master, develop]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install ruff from uv.lock
        run: uv sync --locked --only-group dev

      - name: Ruff check
        run: uv run --no-sync ruff check . --output-format=github
