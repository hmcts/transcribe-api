services:
  postgres:
    image: postgres:18-alpine
    container_name: transcribe-postgres
    environment:
      POSTGRES_USER: transcribe
      POSTGRES_PASSWORD: transcribe
      POSTGRES_DB: transcribe
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcribe -d transcribe"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      # The 18 image keeps its data under a versioned directory below this mount and
      # cannot read a 16 data directory, hence a new volume rather than transcribe-pgdata.
      - transcribe-pgdata-18:/var/lib/postgresql

  # Azure Blob Storage emulator. The app talks to blob storage for audio upload
  # and staging; azurite lets that work without real Azure credentials.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: transcribe-azurite
    command: azurite --blobHost 0.0.0.0 --loose
    ports:
      - "10000:10000"
    volumes:
      - transcribe-azurite:/data

volumes:
  transcribe-pgdata-18:
  transcribe-azurite:
