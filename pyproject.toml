[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcribe-api"
version = "0.1.0"
description = "HMCTS Transcribe — single backend: transcription, real-time speech, document generation, judicial domain"
# Upper bound is passlib's fault, not ours: passlib 1.7.4 imports the stdlib `crypt`
# module, removed in Python 3.13. It is only needed for API-key hashing on the
# machine/webhook ingress. Replacing passlib with direct `bcrypt` calls unlocks
# 3.13+ and is tracked as a follow-up.
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- web framework (union: dictation's floor is higher and adds [standard]) ---
    "fastapi[standard]>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",

    # --- data ---
    "sqlmodel>=0.0.38",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.0",

    # --- azure ---
    "azure-storage-blob>=12.28.0",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.7",
    "opentelemetry-instrumentation-fastapi>=0.61b0",

    # --- auth ---
    # Resolved from git rather than vendored as a committed wheel, and at v0.3.0
    # rather than the 0.2.0 the dictation service had pinned. See architecture 11.
    "hmcts-fastapi-azure-auth @ git+https://github.com/hmcts/hmcts-fastapi-azure-auth@v0.3.0",
    "pyjwt[crypto]>=2.12.1",
    "cryptography>=48.0.0",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",

    # --- http / resilience ---
    "httpx>=0.28.1",
    "aiohttp>=3.13.3",
    "tenacity>=9.1.4",

    # --- stt: transcript quality ---
    "rapidfuzz>=3.14.5",

    # --- audio ---
    "ffmpeg-python>=0.2.0",
    "aiofiles>=25.1.0",

    # --- documents: llm orchestration ---
    "litellm>=1.83.14",
    "langfuse==2.60.10",
    "google-auth>=2.52.0",

    # --- documents: rendering ---
    "docxtpl>=0.20.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "mistletoe>=1.5.1",
    "commonmark>=0.9.1",
    "html2text>=2025.4.15",

    # --- misc ---
    "notifications-python-client>=10.0.1",
    "sentry-sdk[fastapi]>=2.59.0",
    "uwotm8>=0.1.6",
    "pyprojroot>=0.3.0",
    "pandas>=3.0.2",
    "pytz>=2026.2",
    "click>=8.1.7",
]

[project.optional-dependencies]
# Union of both upstream test suites' needs. Floors take the higher of the two.
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.13.5",
    "beautifulsoup4==4.14.3",
    "defusedxml>=0.7.1",
    "ruff==0.15.12",
]

[tool.hatch.metadata]
# Required because hmcts-fastapi-azure-auth is resolved from git rather than a
# package index (there is no HMCTS Python registry). Prefer this to committing
# a wheel into vendor/, which is how both upstream services do it today and how
# they drifted to 0.2.0 against a released 0.3.0.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
