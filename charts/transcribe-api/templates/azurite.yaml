{{- if .Values.azurite.enabled }}
{{- $name := printf "%s-azurite" .Release.Name }}
{{- $env := .Values.python.environment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: azurite
          image: {{ .Values.azurite.image }}
          imagePullPolicy: IfNotPresent
          args: ['azurite-blob', '--blobHost', '0.0.0.0', '--location', '/data', '--loose', '--skipApiVersionCheck']
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: blob
              containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: blob
          livenessProbe:
            tcpSocket:
              port: blob
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: blob
      port: 10000
      targetPort: blob
---
# Azurite starts empty and the API does not create its containers.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-containers
  labels:
    app.kubernetes.io/name: {{ $name }}-containers
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-containers
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: create-containers
          image: {{ .Values.python.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - -c
            - |
              import os
              from azure.core.exceptions import ResourceExistsError
              from azure.storage.blob import BlobServiceClient
              client = BlobServiceClient.from_connection_string(os.environ["AZURE_STORAGE_CONNECTION_STRING"])
              for name in os.environ["CONTAINERS"].split():
                  try:
                      client.create_container(name)
                  except ResourceExistsError:
                      pass
                  print(f"container ready: {name}")
          env:
            - name: AZURE_STORAGE_CONNECTION_STRING
              value: {{ tpl (required "python.environment.AZURE_STORAGE_CONNECTION_STRING is required with azurite.enabled" $env.AZURE_STORAGE_CONNECTION_STRING) . | quote }}
            - name: CONTAINERS
              value: {{ printf "%s %s" $env.AZURE_STORAGE_CONTAINER_NAME $env.AZURE_STORAGE_TRANSCRIPTION_CONTAINER | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
{{- end }}
